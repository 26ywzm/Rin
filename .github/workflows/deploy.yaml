name: Deploy

on:
  push:
    branches:
      - dev
      - main
      - fix/*
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 设置 Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Clone 仓库
      - name: Clone Rin repository
        uses: actions/checkout@v4
        with:
          path: Rin

      # 3. 安装依赖 (npm)
      - name: Install dependencies
        run: |
          cd Rin
          npm ci

      # 4. 运行 migrator 脚本 (Bun)
      - name: Run migrator script
        uses: oven-sh/setup-bun@v1
      - name: Execute migrator
        run: |
          cd Rin
          bun add strip-indent
          bun scripts/migrator.ts

      # 5. Deploy Worker (Wrangler + Node)
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.43.0"
          command: "deploy"
          workingDirectory: Rin
