name: Deploy

on:
  push:
    branches:
      - dev
      - main
      - fix/*
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------
      # 1️⃣ Node.js 环境
      # ------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ------------------------
      # 2️⃣ Clone 仓库
      # ------------------------
      - name: Clone Rin repository
        uses: actions/checkout@v4
        with:
          path: Rin

      # ------------------------
      # 3️⃣ 安装 Bun
      # ------------------------
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      # ------------------------
      # 4️⃣ 安装依赖 & 运行 migrator
      # ------------------------
      - name: Run migrator with Bun  # <<< 新增/修改
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RIN_GITHUB_CLIENT_ID: ${{ secrets.RIN_GITHUB_CLIENT_ID }}
          RIN_GITHUB_CLIENT_SECRET: ${{ secrets.RIN_GITHUB_CLIENT_SECRET }}
          DB_NAME: ${{ vars.DB_NAME }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          S3_ACCESS_HOST: ${{ vars.S3_ACCESS_HOST }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_CACHE_FOLDER: ${{ vars.S3_CACHE_FOLDER }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_FOLDER: ${{ vars.S3_FOLDER }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE }}
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          RSS_TITLE: ${{ vars.RSS_TITLE }}
          RSS_DESCRIPTION: ${{ vars.RSS_DESCRIPTION }}
        run: |
          cd Rin/
          bun install --frozen-lockfile
          bun add strip-indent       # <<< 临时安装缺失依赖
          bun add @sinclair/typebox  # <<< 安装外部依赖，避免 wrangler 编译报错
          bun scripts/migrator.ts

      # ------------------------
      # 5️⃣ 部署 Cloudflare Worker
      # ------------------------
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.43.0"
          command: "deploy"
          workingDirectory: Rin
        env:
          PATH: /opt/hostedtoolcache/node/22.20.0/x64/bin:${{ env.PATH }}
